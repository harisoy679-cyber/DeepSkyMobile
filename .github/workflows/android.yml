
name: Build DeepSkyMobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o DeepSkyMobile_Android_Starter.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Java Kotlin targets
        run: |
          cat > DeepSkyMobile/app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.example.deepskymobile'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.deepskymobile'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd DeepSkyMobile
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSkyMobile-APK
          path: DeepSkyMobile/app/build/outputs/apk/debug/*.apk
