name: Build DeepSkyMobile CameraX APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DeepSkyMobile_CameraX_Project.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: unzip -o DeepSkyMobile_CameraX_Project.zip -d .

      - name: Build debug APK
        run: gradle -p DeepSkyMobile assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSkyMobile-CameraX-APK
          path: DeepSkyMobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
